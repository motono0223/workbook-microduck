# 使い方（リポジトリ直下で）:
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml run --rm rl bash experiments/exp001_baseline_velocity_flat/run.sh
# 注意: ローカルサーバーの GPU は他コンペと共用。ローカルで学習を回さないこと（vast.ai で実行）。
name: microduck
services:
  rl:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: microduck-rl:latest
    container_name: microduck-rl
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - uv-cache:/root/.cache/uv
    environment:
      - WANDB_API_KEY
      - WANDB_MODE
      - NUM_ENVS
      - RUN_NAME
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - MUJOCO_GL=egl
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics]  # graphics: 素の Linux で NVIDIA EGL（GPU 描画）を入れる
volumes:
  uv-cache:
